<!DOCTYPE html>
<html lang="be">
<head>
    <meta charset="utf-8">
    <title>Жанчыны, якія змянілі гісторыю</title>
    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            background: #fffcf5 url('1.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            font-family: "Times New Roman", serif;
            color: #2c1e12;
            box-sizing: border-box;
        }
        .text-box {
            position: relative;
            padding: 80px 190px;
            max-width: 1420px; /* Увеличено в 1.5 раза (с 700px до 1050px) */
            width: 100%;
            background: rgba(255, 252, 245, 0.94);
            border: 6px double #8b5e3c; /* Утолщенная двойная рамка для баланса */
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            text-align: center;
            margin-top: 50px;
            box-sizing: border-box;
        }
        /* Адаптивные увеличенные шрифты для крупного блока */
        .text-box h1 {
            font-size: 2.8em;
            margin-bottom: 20px;
        }
        .text-box h3 {
            font-size: 1.6em;
            margin-bottom: 30px;
        }
        .buttons-container {
            margin-top: 35px;
            display: flex;
            flex-direction: row; /* Кнопки стоят в один ряд */
            justify-content: center; 
            flex-wrap: wrap; /* Корректно переносятся на мобильных телефонах */
            gap: 20px; /* Оптимальный отступ между кнопками в ряду */
        }
        .btn {
            display: inline-block;
            min-width: 350px; /* Кнопки стали шире под размер новой рамки */
            padding: 12px 25px;
            background: #808080;
            color: #fffcf5;
            text-decoration: none;
            border: 2px solid #2c1e12;
            font-family: "Times New Roman", serif;
            font-size: 28px; /* Шрифт кнопок увеличен для читаемости */
            letter-spacing: 0.5px;
            text-align: center;
            transition: background 0.3s;
            box-sizing: border-box;
        }
        .btn:hover {
            background: #b8860b;
        }
    </style>
</head>
<body>
    <div class="text-box">
        <h1><span style="color: #b8860b;">Не слабая палавіна: жанчыны, якія ўславілі Беларусь</span></h1>
        <h2>
		 <div class="motto">«Праз церні мінулага — да святла будучыні»</div>
		
		</h2>
        
        <div class="buttons-container">
            <!-- Первая кнопка: ведет на ваш готовый файл -->
            <a href="Конкурс Зеленок Софья.html" class="btn">Соф'я Шах</a>
            <a href="жанчына 2.html" class="btn">Рэгіна Саламея</a>
            <a href="ггг.html" class="btn">Марыя Ямант</a>
        </div>
    </div>
</body>
</html>
